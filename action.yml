name: 'Hugo setup'
description: 'GitHub Actions for Hugo ⚡️ Setup Hugo quickly and build your site fast. Hugo extended and Hugo Modules are supported.'
author: 'peaceiris'
inputs:
  hugo-version:
    description: 'The Hugo version to download (if necessary) and use. Example: 0.58.2'
    required: false
    default: 'latest'
  extended:
    description: 'Download (if necessary) and use Hugo extended version. Example: true'
    required: false
    default: 'false'
  dart-sass-version:
    description: 'Optional fixed standalone Dart Sass version (e.g. 1.108.2). Requires a GitHub API SHA-256 digest.'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for Dart Sass release metadata. Read-only permissions suffice; set empty for unauthenticated requests.'
    required: false
    default: ${{ github.token }}
runs:
  using: 'node24'
  main: 'lib/index.js'
branding:
  icon: 'package'
  color: 'yellow'
